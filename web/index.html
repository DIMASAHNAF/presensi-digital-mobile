<!DOCTYPE html>
<html>
<head>
  <base href="/mobile/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Presensi Siswa SMK Negeri 1 Beringin">
  <meta name="theme-color" content="#000000">

  <!-- Cache busting headers -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Presensi Siswa">
  <link rel="apple-touch-icon" href="assets/assets/images/logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/assets/images/logo.png"/>

  <title>Portal Siswa • SMKN 1 Beringin</title>
  <link rel="manifest" href="manifest.json">

  <!-- Service Worker Killer to prevent stale cached versions -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) {
          r.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var n of names) caches.delete(n);
      });
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #splash-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      max-width: 380px;
    }
    .splash-logo-wrap {
      position: relative;
      width: 90px;
      height: 90px;
      margin-bottom: 24px;
    }
    .splash-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      animation: logoSpring 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
      transform: scale(0.3);
      box-shadow: 0 0 50px rgba(0, 122, 255, 0.35);
    }
    .splash-ring {
      position: absolute;
      top: -8px;
      left: -8px;
      width: 106px;
      height: 106px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 122, 255, 0.4);
      animation: ringPulse 2s ease-in-out infinite;
      animation-delay: 0.6s;
      opacity: 0;
    }
    .splash-title {
      font-size: 16px;
      font-weight: 800;
      color: #FFFFFF;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      opacity: 0;
      animation: textSlideUp 0.5s ease-out forwards;
      animation-delay: 0.3s;
    }
    .splash-subtitle {
      font-size: 12px;
      font-weight: 600;
      color: #8E8E93;
      letter-spacing: 1.2px;
      margin-bottom: 32px;
      opacity: 0;
      animation: textSlideUp 0.5s ease-out forwards;
      animation-delay: 0.45s;
    }
    .loading-bar-track {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      opacity: 0;
      animation: textSlideUp 0.5s ease-out forwards;
      animation-delay: 0.6s;
    }
    .loading-bar-fill {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #007AFF, #5AC8FA);
      border-radius: 2px;
      animation: loadingProgress 2s ease-in-out infinite;
    }
    .splash-footer {
      position: fixed;
      bottom: 36px;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.25);
      letter-spacing: 0.6px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out forwards;
      animation-delay: 0.8s;
    }

    @keyframes logoSpring {
      0% { opacity: 0; transform: scale(0.2); }
      70% { opacity: 1; transform: scale(1.08); }
      85% { transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes ringPulse {
      0% { opacity: 0; transform: scale(0.85); }
      50% { opacity: 0.6; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(1.4); }
    }
    @keyframes textSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes loadingProgress {
      0% { width: 0%; margin-left: 0; }
      50% { width: 70%; margin-left: 15%; }
      100% { width: 0%; margin-left: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash-loading">
    <div class="splash-logo-wrap">
      <img src="assets/assets/images/logo.png" alt="Logo" class="splash-logo" onerror="this.style.display='none'">
      <div class="splash-ring"></div>
    </div>
    <div class="splash-title">Presensi Siswa</div>
    <div class="splash-subtitle">SMK NEGERI 1 BERINGIN</div>
    <div class="loading-bar-track">
      <div class="loading-bar-fill"></div>
    </div>
  </div>
  <div class="splash-footer">Portal Siswa • iOS Experience v2.0</div>

  <!-- Remove splash once Flutter first frame renders -->
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash-loading');
      if (splash) splash.remove();
      var footer = document.querySelector('.splash-footer');
      if (footer) footer.remove();
    });
  </script>

  <script src="flutter_bootstrap.js?v=2.0.3" async></script>
</body>
</html>
