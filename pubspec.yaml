name: presensi_smkn1_beringin
description: "Aplikasi Presensi Siswa SMK Negeri 1 Beringin Berbasis Biometrik Wajah dan Geofencing Satelit"
publish_to: "none"
version: 2.0.1+3

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Networking & HTTP
  http: ^1.2.2
  
  # State & Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  
  # Geolocation & GPS
  geolocator: 13.0.2
  
  # Camera & Biometric Scanning
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  image: ^4.3.0
  
  # UI & Styling
  google_fonts: ^6.2.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  flutter_spinkit: ^5.2.1
  image_picker: ^1.1.2

dependency_overrides:
  geolocator_android: 4.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
